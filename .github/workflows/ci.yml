name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore CreditCalculator.slnx

      - name: Build
        run: dotnet build CreditCalculator.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test CreditCalculator.slnx --no-build --configuration Release

      - name: Verify formatting
        run: dotnet format CreditCalculator.slnx --verify-no-changes
