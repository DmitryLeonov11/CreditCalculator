name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore CreditCalculator.slnx

      - name: Build
        run: dotnet build CreditCalculator.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test CreditCalculator.slnx --no-build --configuration Release

      - name: Verify formatting
        run: dotnet format CreditCalculator.slnx --verify-no-changes

  frontend:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Lint
        run: npm run lint
        working-directory: client

      - name: Verify formatting
        run: npm run format:check
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client

      - name: Test
        run: npm run test
        working-directory: client

  docker-build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      JWT_SIGNING_KEY: ci-only-signing-key-long-enough-for-validation-123456

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: CreditCalculator.Api/Dockerfile
          push: true
          tags: ghcr.io/dmitryleonov11/credit-calculator-api:latest
          build-args: |
            POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
            JWT_SIGNING_KEY=${{ env.JWT_SIGNING_KEY }}

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          dockerfile: Dockerfile
          push: true
          tags: ghcr.io/dmitryleonov11/credit-calculator-frontend:latest
